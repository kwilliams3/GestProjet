<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GestProjet : planifiez, suivez et pilotez les projets de votre équipe." />
    <meta name="theme-color" content="#4f46e5" />
    <!-- Logo : SVG pour les navigateurs récents, PNG pour les autres, icône d'écran d'accueil pour iOS. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>GestProjet</title>
    <script>
      // Applique le thème (clair/sombre) avant l'affichage pour éviter un flash.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('gp_theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
